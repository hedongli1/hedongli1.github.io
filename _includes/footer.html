<footer class="site-footer">
  <div class="container footer-inner">
    <p class="footer-note">© {{ site.time | date: '%Y' }} {{ site.title }} · 用 Jekyll 构建 · 托管在 GitHub Pages</p>
    <nav class="footer-links" aria-label="页脚链接">
      {% for item in site.social %}
        <a href="{{ item[1] }}" target="_blank" rel="noopener">{{ item[0] }}</a>
      {% endfor %}
    </nav>
  </div>
</footer>
